# HuellaIP collector: field mapping for GoFlow2 v2.2.7.
#
# Adds the IPFIX / NetFlow v9 NAT fields (IANA elements 225 to 228), needed to attribute
# download flows to the private address of each device.
#
# When formatter.fields is set, GoFlow2 prints only the listed fields. The list therefore
# carries every field GoFlow2 v2.2.7 prints by default, in its order, followed by the NAT
# fields. Review it whenever the GoFlow2 version changes.
#
# MAC addresses need no mapping: GoFlow2 already fills src_mac from elements 56 and 81
# and dst_mac from 80 and 57 (producer/proto/producer_nf.go).
formatter:
  fields:
    - type
    - time_received_ns
    - sequence_num
    - sampling_rate
    - sampler_address
    - time_flow_start_ns
    - time_flow_end_ns
    - bytes
    - packets
    - src_addr
    - dst_addr
    - etype
    - proto
    - src_port
    - dst_port
    - in_if
    - out_if
    - src_mac
    - dst_mac
    - src_vlan
    - dst_vlan
    - vlan_id
    - ip_tos
    - forwarding_status
    - ip_ttl
    - ip_flags
    - tcp_flags
    - icmp_type
    - icmp_code
    - ipv6_flow_label
    - fragment_id
    - fragment_offset
    - src_as
    - dst_as
    - next_hop
    - next_hop_as
    - src_net
    - dst_net
    - bgp_next_hop
    - bgp_communities
    - as_path
    - mpls_ttl
    - mpls_label
    - mpls_ip
    - observation_domain_id
    - observation_point_id
    - layer_stack
    - layer_size
    - ipv6_routing_header_addresses
    - ipv6_routing_header_seg_left
    - post_nat_src_addr
    - post_nat_dst_addr
    - post_napt_src_port
    - post_napt_dst_port
  protobuf:
    - name: post_nat_src_addr
      index: 1225
      type: bytes
    - name: post_nat_dst_addr
      index: 1226
      type: bytes
    - name: post_napt_src_port
      index: 1227
      type: varint
    - name: post_napt_dst_port
      index: 1228
      type: varint
  render:
    post_nat_src_addr: ip
    post_nat_dst_addr: ip
ipfix:
  mapping:
    - field: 225
      destination: post_nat_src_addr
    - field: 226
      destination: post_nat_dst_addr
    - field: 227
      destination: post_napt_src_port
    - field: 228
      destination: post_napt_dst_port
netflowv9:
  mapping:
    - field: 225
      destination: post_nat_src_addr
    - field: 226
      destination: post_nat_dst_addr
    - field: 227
      destination: post_napt_src_port
    - field: 228
      destination: post_napt_dst_port
